services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0.39
    container_name: product-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./backend/src/main/resources/sql:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00

  elasticsearch:
    build:
      context: ./docker/elasticsearch
      args:
        ES_VERSION: 8.13.4
    image: product-elasticsearch:8.13.4-ik-pinyin
    container_name: product-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      TZ: Asia/Shanghai
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.m.daocloud.io/library/kibana:8.13.4
    container_name: product-kibana
    restart: unless-stopped
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      I18N_LOCALE: zh-CN
      TZ: Asia/Shanghai
    ports:
      - "5601:5601"
    volumes:
      - kibana_data:/usr/share/kibana/data

volumes:
  mysql_data:
  es_data:
  kibana_data:
